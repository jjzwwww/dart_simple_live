name: Build ARM64 Linux Deb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 'xiaoyaocz/dart_simple_live'
          ref: 'dev_v1.11.7'
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y curl git unzip xz-utils zip clang cmake ninja-build pkg-config \
              libgtk-3-dev liblzma-dev libmpv-dev

      - name: Install & Setup Flutter (ARM64)
        run: |
          # 1. 克隆官方 stable 分支到家目录
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $HOME/flutter
          
          # 2. 信任 Flutter 仓库路径（防止 git 权限拦截）
          git config --global --add safe.directory $HOME/flutter

          # 3. 软链接到系统全局 bin 目录（彻底解决找不到命令的问题）
          sudo ln -sf $HOME/flutter/bin/flutter /usr/local/bin/flutter
          sudo ln -sf $HOME/flutter/bin/dart /usr/local/bin/dart
          echo "\(HOME/flutter/bin" >>\)GITHUB_PATH

          # 4. 初始化配置并开启桌面端支持
          flutter config --no-analytics
          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: Build Linux App
        run: |
          cd simple_live_app
          flutter pub get
          flutter build linux --release

      - name: Create Deb Package
        run: |
          cd simple_live_app/build/linux/arm64/release
          mkdir -p deb/opt/simple-live deb/usr/share/applications deb/DEBIAN
          cp -r bundle/* deb/opt/simple-live/
          
          # 创建 control 文件
          cat << 'EOF' > deb/DEBIAN/control
          Package: com.simplelive.app
          Version: 1.11.7
          Section: video
          Priority: optional
          Architecture: arm64
          Depends: libgtk-3-0, libmpv1 | libmpv2
          Description: Simple Live client for ARM64 UOS
          EOF

          # 创建 desktop 文件
          cat << 'EOF' > deb/usr/share/applications/simple-live.desktop
          [Desktop Entry]
          Name=Simple Live
          Exec=/opt/simple-live/simple_live_app
          Type=Application
          Categories=AudioVideo;Player;
          Terminal=false
          EOF

          # 构建 deb 安装包
          dpkg-deb --build deb simple-live_1.11.7_arm64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-arm64-deb
          path: simple_live_app/build/linux/arm64/release/simple-live_1.11.7_arm64.deb
